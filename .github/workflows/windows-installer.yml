name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "main.py"
      - "overlay_measure/**"
      - "installer/**"
      - "scripts/build_release.*"
      - "scripts/generate_release_metadata.py"
      - "requirements*.txt"
      - "assets/**"
      - "sample_data/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Setup
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency validation failed." }

      - name: Install Inno Setup
        run: |
          $Compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }

      - name: Test and build installer
        run: |
          $BuildLog = Join-Path $PWD 'build-output.txt'
          try {
            ./scripts/build_release.ps1 -Python (Get-Command python).Source *>&1 | Tee-Object -FilePath $BuildLog
          }
          catch {
            Write-Output "::error title=Windows build failure::Native exit code $LASTEXITCODE; $($_.Exception.Message)"
            if (Test-Path $BuildLog) {
              $Details = Get-Content $BuildLog -Tail 160 | Where-Object { $_ -match 'FAILED |ERROR |AssertionError|passed|failed|Fatal|Exception|Tests failed' } | Select-Object -Last 12
              foreach ($Detail in $Details) {
                $SafeDetail = ([string]$Detail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Build diagnostic::$SafeDetail"
              }
            }
            throw
          }
          finally {
            if (Test-Path $BuildLog) {
              $Summary = @('## Windows build output', '```text') + (Get-Content $BuildLog -Tail 160) + @('```')
              $Summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }

      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.run_number }}
          path: |
            release/*_Setup.exe
            release/*_Setup.exe.sha256
            release/update_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_number }}
          path: |
            build/**/*.txt
            build/**/*.html
            installer/generated_version_info.txt
            build-output.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish version release
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.run_number }}
          path: release
      - name: Publish installer, checksum and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'from overlay_measure import __version__; print(__version__)')
          TAG="v$VERSION"
          test -f "release_notes_$TAG.md"
          test -f "release/SOMA_Vision_Metrology_V${VERSION}_Setup.exe"
          (cd release && sha256sum --check "SOMA_Vision_Metrology_V${VERSION}_Setup.exe.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" \
              --title "SOMA Vision Metrology V$VERSION" \
              --notes-file "release_notes_$TAG.md" \
              --latest
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "SOMA Vision Metrology V$VERSION" \
              --notes-file "release_notes_$TAG.md" \
              --latest
          fi
